services:
  postgres:
    image: postgres:16-alpine
    container_name: varejomix-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-varejomix}
      POSTGRES_USER: ${POSTGRES_USER:-varejomix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15

  mongo:
    image: mongo:7.0
    container_name: varejomix-mongo
    environment:
      MONGO_INITDB_DATABASE: varejomix
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
  mongo_data:
